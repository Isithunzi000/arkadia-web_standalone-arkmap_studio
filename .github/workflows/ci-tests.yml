# Regresja testowa — na każdy push do main (w tym automatyczne commity sond).
# Fixture przypięty do release 0.205.0 (tests/fetch-fixture.sh) — deterministyczne wejście.
# Bramka semantyczna generatora transportów (sync-transports.yml) jest ścianą; ten
# workflow jest siecią — weryfikuje każdy commit po fakcie, ingerencja nie jest wymagana.
name: CI testy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jeden run naraz — sonda transportów i ręczne pushy nie odpalają regresji równolegle.
concurrency:
  group: ci-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # zapas na miss cache playwright i wolniejszy runner; krok regresji ma wlasny timeout 1380 s
    steps:
      - name: Checkout repo (pełna historia — testy różnicowe robią git show)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fixture mapy (przypięty release 0.205.0)
        run: |
          set -euo pipefail
          timeout 240 bash tests/fetch-fixture.sh

      - name: Cache Chromium (Playwright) — flake pobierania nie zabija runu
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-1.54.2
          restore-keys: ${{ runner.os }}-ms-playwright-

      - name: Chromium headless (dla tests/empirical.sh, przez Playwright)
        run: |
          set -euo pipefail
          npx -y playwright@1.54.2 install --with-deps chromium
          BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          [ -n "$BIN" ]
          echo "CHROMIUM_BIN=$BIN" >> "$GITHUB_ENV"

      # Hardening E15 (2026-08-24): E15 jedzie na realnym zegarze przez CDP
      # (tests/empirical_run.py) — wymaga python3-websockets. Wersja spinana
      # jak playwright powyzej (deterministyczne srodowisko CI).
      - name: Python websockets (dla tests/empirical_run.py — E15 real clock)
        run: python3 -m pip install websockets==15.0.1

      - name: Regresja (wszystkie harnessy + kampania empiryczna)
        run: timeout 1380 bash tests/run-all.sh

# Sync definicji transportów (statki/dyliżanse) z Delwing/arkadia-web-client-extension — 2× dziennie.
# - Ten sam SHA upstreama co w bloku TRANSPORT-DATA ⇒ cisza, zero commitów.
# - Generator (tools/sync-transports.mjs) waliduje schemat ORAZ semantykę (etykiety
#   przystanków): błąd ⇒ workflow czerwony, nic nie ląduje w main, auto-issue z diagnozą.
# - Zmiana tylko danych ⇒ bez bumpa APP_VERSION.
name: Sync transportów

on:
  schedule:
    - cron: '47 4 * * *'    # 04:47 UTC — rano (06:47 PL latem), przed sondą mapy (05:17)
    - cron: '47 20 * * *'   # 20:47 UTC — wieczorem (22:47 PL latem), za szczytem commitów upstream
  workflow_dispatch:        # ręczne odpalenie z zakładki Actions

# Jeden run naraz — równoległe uruchomienia (cron + dispatch) odbijałyby się
# na pushu (non-fast-forward) i dawały fałszywie czerwony run.
concurrency:
  group: sync-transports
  cancel-in-progress: false

permissions:
  contents: write   # push na main
  issues: write     # auto-issue przy anomalii danych upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # zawieszony clone nie pali domyślnych 6 h
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Pobierz upstream (sparse: tylko definicje transportów)"
        run: |
          set -euo pipefail
          timeout 180 git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Delwing/arkadia-web-client-extension upstream
          cd upstream
          git sparse-checkout set src/client/scripts/ships src/client/scripts/other
          git rev-parse HEAD > UPSTREAM_SHA
          mv src/client/scripts/ships src/client/scripts/other "$GITHUB_WORKSPACE/"
          mv UPSTREAM_SHA "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -rf upstream
          echo "Upstream SHA: $(cat UPSTREAM_SHA)"

      - name: Short-circuit — ten sam SHA = cisza
        id: gate
        run: |
          set -euo pipefail
          UP=$(cat UPSTREAM_SHA)
          CUR=$(grep -oP '(?<=// Upstream: )[0-9a-f]{40}' arkmap_studio.html || echo "brak")
          echo "obecny=$CUR nowy=$UP"
          if [ "$CUR" = "$UP" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Generuj blok (z walidacją schematu i semantyki)
        id: generate
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p transport-src
          mv ships other UPSTREAM_SHA transport-src/
          node tools/sync-transports.mjs transport-src arkmap_studio.html

      - name: Commit i push, jeśli jest diff
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "generator: bez zmian — cisza"; exit 0; fi
          SHORT=$(cut -c1-7 transport-src/UPSTREAM_SHA)
          LINES=$(grep -oP '(?<=linii: )\d+' arkmap_studio.html | head -1)
          STOPS=$(grep -oP '(?<=przystanków: )\d+' arkmap_studio.html | head -1)
          git config user.name "Isithunzi000"
          git config user.email "isithunzi000@users.noreply.github.com"
          git add arkmap_studio.html
          git commit -m "Transporty: sync z upstream @${SHORT} (${LINES} linii, ${STOPS} przystanków)"
          timeout 120 git push origin HEAD:main

      # Auto-issue: TYLKO gdy walidacja danych padnie (anomalia upstream). Błędy sieci/clone
      # są przejściowe — kolejny run je przeliczy, issue byłoby szumem. Wywołania gh z || true:
      # porażka notyfikacji nigdy nie maskuje pierwotnego werdyktu bramki.
      - name: Zgłoś anomalię danych (auto-issue)
        if: always() && steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create sync-transports --force --description "Anomalia danych transportów z upstream" 2>/dev/null || true
          NUM=$(gh issue list --label sync-transports --state open --json number --jq '.[0].number // empty'  # sync-F1: pusta lista → null(string) → -n zawsze true 2>/dev/null || true)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="Generator tools/sync-transports.mjs odrzucił dane z Delwing/arkadia-web-client-extension (bramka semantyczna: etykiety przystanków). Dane NIE trafiły do arkmap_studio.html (fail-closed). Szczegóły w logu runu: ${RUN_URL} — kolejne runy ponawiają automatycznie; po ustaniu anomalii to issue zamknie się samo."
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY" || true
          else
            gh issue create --title "Sync transportów: anomalia danych upstream" --label sync-transports --body "$BODY" || true
          fi

      - name: Zamknij issue po ustaniu anomalii
        if: always() && steps.generate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --label sync-transports --state open --json number --jq '.[0].number // empty'  # sync-F1: pusta lista → null(string) → -n zawsze true 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Dane upstream znów przechodzą walidację — zamykam." || true
            gh issue close "$NUM" || true
          fi

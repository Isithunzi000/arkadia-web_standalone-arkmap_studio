<!doctype html>
<html>
<head><meta charset="utf-8"><title>empirical-driver</title></head>
<body>
<iframe id="f" src="../arkmap_studio.html" style="width:1500px;height:950px;border:0"></iframe>
<pre id="results"></pre>
<div id="done" style="display:none"></div>
<script>
'use strict';
// ═══ Driver empiryczny .arkdelta ═══
// Ładuje pełną aplikację w iframe i wykonuje scenariusze przez realne funkcje
// (eval dociera do leksykalnych globali obu tagów <script>). Wyniki lądują w
// <pre id="results"> jako linie "R|STATUS|id|msg" + "SUMMARY|pass=N|fail=M".
// Filtrowanie: ?g=GRUPA (prefiks id przed kropką) albo ?sc=id1,id2.
// Uruchomienie: tests/empirical.sh (python http.server + chromium --dump-dom).

const $f   = document.getElementById('f');
const $out = document.getElementById('results');
const W = () => $f.contentWindow;

let _pass = 0, _fail = 0;
function REC(status, id, msg) {
  if (status === 'PASS') _pass++; else if (status === 'FAIL') _fail++;
  const clean = String(msg || '').replace(/[\r\n<>|]+/g, ' ').slice(0, 500);
  $out.textContent += 'R|' + status + '|' + id + '|' + clean + '\n';
}
const PASS = (id, msg) => REC('PASS', id, msg);
const FAIL = (id, msg) => REC('FAIL', id, msg);
const A    = (id, cond, msg) => REC(cond ? 'PASS' : 'FAIL', id, msg);
const EQ   = (id, actual, expected, msg) => {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  REC(a === e ? 'PASS' : 'FAIL', id, (msg ? msg + ' ' : '') + '[actual=' + a + ' expected=' + e + ']');
};

// ev(kod) — synchroniczny eval WYRAŻENIA w kontekście aplikacji.
// Zwraca { ok:true, val } (val: JSON-safe) albo { ok:false, err }.
function ev(code) {
  try {
    const wrapped = '(function(){ try { return JSON.stringify({ ok:true, val:(' + code + ') }); }'
                  + ' catch(e){ return JSON.stringify({ ok:false, err:String(e && e.message || e) }); } })()';
    const r = W().eval(wrapped);
    return JSON.parse(r);
  } catch (e) { return { ok: false, err: 'outer: ' + String(e && e.message || e) }; }
}
// eva(kod) — jak ev, ale wyrażenie może zwracać Promise (awaitowane).
async function eva(code) {
  try {
    const p = W().eval('(function(){ return Promise.resolve().then(function(){ return (' + code + '); })'
                     + '.then(function(v){ return { ok:true, val:v }; },'
                     + '      function(e){ return { ok:false, err:String(e && e.message || e) }; }); })()');
    return await p;
  } catch (e) { return { ok: false, err: 'outer: ' + String(e && e.message || e) }; }
}
// AEV: asercja pomocnicza — FAIL gdy ev się wywalił, inaczej zwraca val.
function AEV(id, r, msg) {
  if (!r.ok) { FAIL(id, (msg ? msg + ' ' : '') + '[ev error: ' + r.err + ']'); return undefined; }
  return r.val;
}

// ── Fixture + ładowanie bazy ─────────────────────────────────────────────────
let fixBuf = null;  // ArrayBuffer map_master3.dat (pobierany raz)
async function fetchFixture() {
  if (fixBuf) return;
  const resp = await fetch('../map_master3.dat');
  if (!resp.ok) throw new Error('fixture HTTP ' + resp.status);
  fixBuf = await resp.arrayBuffer();
}
// Świeża baza per scenariusz: applyMap resetuje undoStack/redoStack/deltaLog/
// baseInfo/duchy i wychodzi z trybu edycji; startLocalEditMode wchodzi z powrotem.
// fmt: 'dat' = prosto z fixture; 'arkmap' = roundtrip przez _serializeMap.
function loadBase(fmt) {
  const ark = W().datToArkmap(fixBuf.slice(0));
  W().applyMap(ark);
  if (fmt === 'arkmap') {
    const text = W()._serializeMap();
    W().applyMap(JSON.parse(text));
  }
  W().startLocalEditMode();
  return ev('({ rooms: Object.keys(state.roomById).length, areas: state.areas.size,'
          + ' crc: state.baseInfo && state.baseInfo.crc, deltaLog: state.deltaLog.length })');
}

// ── Rejestr scenariuszy ──────────────────────────────────────────────────────
const SC = [];
function scenario(id, fn) { SC.push({ id, fn }); }

// ═══ GRUPA SMOKE — fundament: boot, ładowanie, commit, roundtrip ═══

scenario('SMOKE.boot', async () => {
  const fns = ev('typeof datToArkmap === "function" && typeof applyMap === "function"'
    + ' && typeof buildDelta === "function" && typeof validateDeltaText === "function"'
    + ' && typeof classifyDelta === "function" && typeof applyDelta === "function"'
    + ' && typeof startLocalEditMode === "function" && typeof _serializeMap === "function"'
    + ' && typeof undoAll === "function" && typeof redoAll === "function"');
  A('SMOKE.boot.fns', AEV('SMOKE.boot.fns', fns) === true, 'funkcje rdzenia dostepne w iframe');
  A('SMOKE.boot.dom', !!W().document.getElementById('cv') && !!W().document.getElementById('delta-panel'),
    'canvas i panel kalki w DOM');
});

scenario('SMOKE.load', async () => {
  const st = AEV('SMOKE.load', loadBase('dat'), 'zaladowanie fixture .dat');
  if (!st) return;
  A('SMOKE.load.rooms', st.rooms > 1000, 'rooms=' + st.rooms);
  A('SMOKE.load.areas', st.areas > 10, 'areas=' + st.areas);
  A('SMOKE.load.deltalog', st.deltaLog === 0, 'deltaLog pusty po applyMap');
  A('SMOKE.load.crc', typeof st.crc === 'string' && /^[0-9a-f]{16}$/i.test(st.crc), 'baseInfo.crc=' + st.crc);
  A('SMOKE.load.edit', ev('state.editMode === true').val === true, 'tryb edycji aktywny');
});

scenario('SMOKE.edit', async () => {
  loadBase('dat');
  const before = ev('Object.keys(state.roomById).length').val;
  W().addRoomAtPosition(9999, 9999);   // wolna komórka w aktywnym obszarze
  const after = ev('({ n: Object.keys(state.roomById).length, dl: state.deltaLog.length,'
                 + ' t: state.deltaLog.length ? state.deltaLog[0].type : null })').val;
  A('SMOKE.edit.add', after && after.n === before + 1 && after.dl === 1 && after.t === 'ADD_ROOM',
    'ADD_ROOM przez realny commit [po=' + JSON.stringify(after) + ']');
  W().undoAll();
  const und = ev('({ n: Object.keys(state.roomById).length, dl: state.deltaLog.length })').val;
  A('SMOKE.edit.undo', und && und.n === before && und.dl === 0, 'undoAll wraca do bazy');
});

scenario('SMOKE.arkmap', async () => {
  const st1 = AEV('SMOKE.arkmap', loadBase('dat'), 'baza .dat');
  if (!st1) return;
  const st2 = AEV('SMOKE.arkmap', loadBase('arkmap'), 'baza .arkmap (roundtrip _serializeMap)');
  if (!st2) return;
  EQ('SMOKE.arkmap.rooms', st2.rooms, st1.rooms, 'liczba pokoi identyczna');
  EQ('SMOKE.arkmap.areas', st2.areas, st1.areas, 'liczba obszarow identyczna');
  EQ('SMOKE.arkmap.crc', st2.crc, st1.crc, 'crc bazy identyczne miedzy formatami');
});

// ═══ GRUPA E0 — tożsamość między formatami (.dat vs .arkmap) ═══
// Baza .arkmap powstaje roundtripem _serializeMap -> JSON.parse -> applyMap
// z bazy .dat. Tożsamość = identyczne crc bazy, identyczna klasyfikacja tej
// samej kalki, identyczny stan po apply (odcisk = _computeBaseInfo().crc).

let _mixedText = null;   // tekst kalki (cache między scenariuszami E0)
let _mixedDelta = null;  // sparsowany obiekt (realm iframe)

// Kalka mieszana realnymi commitami: ADD_ROOM (sid d:1), ADD_EXIT do sid,
// ADD_EXIT real-real, MOVE_ROOM, DELETE_ROOM. Deterministyczna na fixture.
function buildMixedDelta() {
  const pick = ev('(function(){'
    + ' const ids = Object.keys(state.roomById).map(Number).sort(function(a,b){ return a-b; });'
    + ' const dirs = ["n","e","s","w"];'
    + ' let a = null, b = null, c = null;'
    + ' for (const id of ids) { const r = state.roomById[id];'
    + '   if (dirs.some(function(d){ return !(r.exits || {})[d]; })) { a = id; break; } }'
    + ' for (const id of ids) { if (id === a) continue; const r = state.roomById[id];'
    + '   if (dirs.some(function(d){ return !(r.exits || {})[d]; })) { b = id; break; } }'
    + ' for (const id of ids) { if (id === a || id === b) continue;'
    + '   const r = state.roomById[id];'
    + '   if (Object.keys(r.exits || {}).length > 0) { c = id; break; } }'
    + ' const fr = function(id){ return dirs.find(function(d){ return !(state.roomById[id].exits || {})[d]; }); };'
    + ' return { a: a, b: b, c: c, dirA: fr(a), dirB: fr(b) };'
    + '})()').val;
  W().addRoomAtPosition(9999, 9999);                       // ADD_ROOM -> sid d:1
  const newId = ev('state.deltaLog[state.deltaLog.length-1].roomId').val;
  W().commitAddExit(pick.a, pick.dirA, newId, false);      // ADD_EXIT -> cel = sid
  W().commitAddExit(pick.b, pick.dirB, pick.a, false);     // ADD_EXIT real -> real
  const mv = ev('(function(){ const r = state.roomById[' + pick.b + '];'
    + ' return { x: r.x, y: r.y, z: r.z }; })()').val;
  const roomB = W().eval('state.roomById[' + pick.b + ']');
  // commitMoveRoom jest data-only — jak w handlerze drag, caller mutuje pozycje PRZED
  // commitem (inaczej stan "po commitach" nie pokrywa sie ze stanem "po apply").
  W().eval('(function(){ const r = state.roomById[' + pick.b + ']; r.x = ' + (mv.x + 500) + '; r.y = ' + (mv.y + 500) + '; })()');
  W().commitMoveRoom(roomB, mv.x, mv.y, mv.z, mv.x + 500, mv.y + 500, mv.z);  // MOVE_ROOM
  W().deleteRoom(pick.c);                                  // DELETE_ROOM (z wyjściami)
  return ev('buildDelta()').val;
}

// Klasyfikacja tekstu kalki na BIEŻĄCEJ bazie; projekcja do pól porównywalnych.
function classifyText(text) {
  const v = W().validateDeltaText(text);
  if (!v.ok) return { err: v.errors };
  const items = W().classifyDelta(v.delta);
  return { delta: v.delta, items: items.map(i => ({ t: i.type, c: i.cls, n: i.note || null, coll: !!i.coll })) };
}

// Przepakowanie kalki z innym meta.base — checksumy przeliczone funkcjami
// aplikacji, wiec plik przechodzi walidacje (fail-closed) i dociera do baseCheck.
function repackDeltaWithBase(deltaObj, newBase) {
  const d = JSON.parse(JSON.stringify(deltaObj));
  d.meta.base = newBase;
  d.checksums = W()._deltaChecksums(d.meta, d.ops);
  return W().stableStringify(d);
}

scenario('E0.identity', async () => {
  loadBase('dat');
  const crcD = ev('state.baseInfo.crc').val;
  _mixedText = buildMixedDelta();          // commity na bazie .dat -> kalka
  A('E0.identity.built', typeof _mixedText === 'string' && _mixedText.length > 100,
    'kalka zbudowana (' + (_mixedText || '').length + ' B)');
  loadBase('dat');                         // swieza baza .dat (bez commitow)
  const cD = classifyText(_mixedText);
  A('E0.identity.valid-dat', !cD.err, 'walidacja na .dat' + (cD.err ? ' ' + cD.err.join('; ') : ''));
  _mixedDelta = cD.delta || null;
  const stA = AEV('E0.identity', loadBase('arkmap'), 'baza .arkmap');
  if (!stA) return;
  EQ('E0.identity.crc', stA.crc, crcD, 'crc bazy .arkmap == crc bazy .dat');
  const cA = classifyText(_mixedText);
  A('E0.identity.valid-ark', !cA.err, 'walidacja na .arkmap');
  EQ('E0.identity.cls', cA.items, cD.items, 'klasyfikacja identyczna miedzy formatami');
  A('E0.identity.classes', cD.items && cD.items.length === 5 && cD.items.every(i => i.c === 'ok'),
    'wszystkie 5 opow klasyfikuje sie jako ok na czystej bazie');
});

scenario('E0.apply', async () => {
  if (!_mixedDelta) { FAIL('E0.apply', 'brak kalki z E0.identity'); return; }
  loadBase('dat');
  const rD = W().applyDelta(_mixedDelta, null, undefined);
  const fpD = ev('({ crc: _computeBaseInfo().crc, rooms: Object.keys(state.roomById).length })').val;
  loadBase('arkmap');
  const rA = W().applyDelta(_mixedDelta, null, undefined);
  const fpA = ev('({ crc: _computeBaseInfo().crc, rooms: Object.keys(state.roomById).length })').val;
  EQ('E0.apply.applied', { a: rA.applied, s: rA.skipped.length }, { a: rD.applied, s: rD.skipped.length },
    'wynik apply identyczny');
  A('E0.apply.all', rD.applied === 5 && rD.skipped.length === 0, '5 opow applied, 0 skipped');
  EQ('E0.apply.state', fpA, fpD, 'stan po apply identyczny miedzy formatami');
});

scenario('E0.basecheck', async () => {
  if (!_mixedDelta) { FAIL('E0.basecheck', 'brak kalki z E0.identity'); return; }
  for (const fmt of ['dat', 'arkmap']) {
    loadBase(fmt);
    const okChk = W()._deltaBaseCheck(_mixedDelta.meta.base);
    A('E0.basecheck.match-' + fmt, okChk === null, 'zgodna baza -> brak dialogu [' + fmt + ']');
    const badText = repackDeltaWithBase(_mixedDelta, { crc: 'deadbeef', version: '0.0.0-test' });
    const vBad = W().validateDeltaText(badText);
    A('E0.basecheck.valid-' + fmt, vBad.ok === true, 'przepakowana kalka przechodzi walidacje [' + fmt + ']');
    if (vBad.ok) {
      const chk = W()._deltaBaseCheck(vBad.delta.meta.base);
      A('E0.basecheck.mismatch-' + fmt, chk && chk.kind === 'mismatch' && chk.baseCrc === 'deadbeef',
        'obce crc -> mismatch [' + fmt + ']');
    }
    const nbText = repackDeltaWithBase(_mixedDelta, {});
    const vNb = W().validateDeltaText(nbText);
    if (vNb.ok) {
      const chk = W()._deltaBaseCheck(vNb.delta.meta.base);
      A('E0.basecheck.nobase-' + fmt, chk && chk.kind === 'nobase', 'brak bazy -> nobase [' + fmt + ']');
    } else FAIL('E0.basecheck.nobase-' + fmt, 'walidacja odrzucila base={}');
  }
});

// ex(kod) — jak ev, ale kod to BLOK INSTRUKCJI (auto-IIFE); rzuca przy bledzie.
function ex(code) {
  const r = ev('(function(){ ' + code + ' })()');
  if (!r.ok) throw new Error('ex: ' + r.err + ' [kod: ' + code.slice(0, 120) + ']');
  return r.val;
}

// ═══ GRUPA E1 — roundtrip 25 typow op przez realne commity ═══
// Kazdy typ laduje w deltaLog przez PRAWDZIWA sciezke commitu (funkcja rdzenia
// albo realny handler DOM). Potem: buildDelta -> walidacja -> swieza baza ->
// klasyfikacja (same ok) -> apply -> crc stanu == crc stanu po commitach.
// Idempotencja: re-klasyfikacja po apply = same done; drugi apply = 0.

const E1_ALL25 = ['ADD_ROOM','DELETE_ROOM','EDIT_ROOM','EDIT_EXIT','PAINT_BATCH',
  'MOVE_ROOM','MOVE_ROOM_TO_AREA','ADD_EXIT','DELETE_EXIT','DELETE_SPECIAL_EXIT',
  'ADD_AREA','DELETE_AREA','EDIT_AREA','ADD_CL','EDIT_CL','DELETE_CL',
  'DELETE_SUPPRESSOR','ADD_SUPPRESSOR','AUTO_FIX_SUPPRESSORS','ADD_LABEL',
  'EDIT_LABEL','DELETE_LABEL','MOVE_LABEL','RESIZE_LABEL','EDIT_ENV_COLOR'];

let _e1Text = null, _e1Delta = null, _e1CrcEdited = null, _e1Types = null;

// Deterministyczny wybor pokoi fixture pod kazdy typ op (najmniejsze pasujace id).
const E1_SCAN = '(function(){'
  + ' const ids = Object.keys(state.roomById).map(Number).sort(function(a,b){ return a-b; });'
  + ' const R = function(id){ return state.roomById[id]; };'
  + ' const DIRS = ["n","ne","e","se","s","sw","w","nw","up","down","in","out"];'
  + ' const OPP = { n:"s", s:"n", e:"w", w:"e", ne:"sw", sw:"ne", nw:"se", se:"nw", up:"down", down:"up", in:"out", out:"in" };'
  + ' const hasExit = function(id){ return Object.keys(R(id).exits || {}).length > 0; };'
  + ' const freeDir = function(id){ return DIRS.find(function(d){ return !(R(id).exits || {})[d] && !(R(id).special_exits || {})[d]; }); };'
  + ' const used = [];'
  + ' const take = function(pred){ const id = ids.find(function(i){ return used.indexOf(i) < 0 && pred(i); });'
  + '   if (id !== undefined) used.push(id); return id; };'
  + ' const roomA = take(hasExit);'
  + ' const exitDirA = Object.keys(R(roomA).exits)[0];'
  + ' const srcX = take(freeDir);'
  + ' const srcY = take(freeDir);'
  + ' const roomD = take(function(){ return true; });'
  + ' const roomE = take(function(){ return true; });'
  + ' const roomF = take(hasExit);'
  + ' const exitDirF = Object.keys(R(roomF).exits)[0];'
  + ' const roomG = take(function(id){ return Object.keys(R(id).special_exits || {}).length > 0; });'
  + ' const specCmdG = roomG !== undefined ? Object.keys(R(roomG).special_exits)[0] : null;'
  + ' const roomH = take(function(){ return true; });'
  + ' const roomI = take(function(){ return true; });'
  + ' const roomJ = take(hasExit);'
  + ' const roomK = take(function(id){ const cl = R(id).custom_lines || {};'
  + '   return Object.keys(cl).some(function(d){ return cl[d].points && cl[d].points.length > 0; }); });'
  + ' const clDirK = roomK !== undefined ? Object.keys(R(roomK).custom_lines).find(function(d){'
  + '   const c = R(roomK).custom_lines[d]; return c.points && c.points.length > 0; }) : null;'
  + ' let pair = null;'
  + ' for (const id of ids) {'
  + '   if (used.indexOf(id) >= 0) continue;'
  + '   const ex = R(id).exits || {};'
  + '   for (const d of Object.keys(ex)) {'
  + '     const b = ex[d]; const opp = OPP[d];'
  + '     if (!opp || !R(b) || used.indexOf(b) >= 0) continue;'
  + '     if ((R(id).custom_lines || {})[d]) continue;'
  + '     const clB = (R(b).custom_lines || {})[opp];'
  + '     if (clB && clB.points && clB.points.length) continue;'
  + '     pair = { a: id, dir: d, b: b, opp: opp, ax: R(id).x, ay: R(id).y, bx: R(b).x, by: R(b).y };'
  + '     break;'
  + '   }'
  + '   if (pair) break;'
  + ' }'
  + ' if (pair) { used.push(pair.a); used.push(pair.b); }'
  + ' const roomS = take(function(id){ return DIRS.some(function(d){ return !(R(id).custom_lines || {})[d]; }); });'
  + ' const suppDirS = DIRS.find(function(d){ return !(R(roomS).custom_lines || {})[d]; });'
  + ' return { roomA: roomA, exitDirA: exitDirA, srcX: srcX, srcDirX: freeDir(srcX),'
  + '   srcY: srcY, srcDirY: freeDir(srcY), roomD: roomD, roomE: roomE,'
  + '   roomF: roomF, exitDirF: exitDirF, roomG: roomG, specCmdG: specCmdG,'
  + '   roomH: roomH, roomI: roomI, roomJ: roomJ, roomK: roomK === undefined ? null : roomK,'
  + '   clDirK: clDirK, pair: pair, roomS: roomS, suppDirS: suppDirS };'
  + '})()';

function _e1SetRoom(id) {  // selekcja pokoju (setup pod commity dialogowe)
  ex('state.selected = ' + id + ';'
   + ' state.editSnapshot = JSON.parse(JSON.stringify(state.roomById[' + id + ']));'
   + ' populateEditForm(state.roomById[' + id + ']); return "ok";');
}
function _e1MouseUp() {  // realny event mouseup na canvasie (commity MOVE/RESIZE_LABEL)
  const cv = W().document.getElementById('cv');
  cv.dispatchEvent(new (W().MouseEvent)('mouseup', { clientX: 700, clientY: 400, button: 0, bubbles: true }));
}
function _e1LastType() {
  return ev('state.deltaLog.length ? state.deltaLog[state.deltaLog.length-1].type : null').val;
}
// Punkty CL wzdluz osi A->B z prostopadlym przesunieciem off (nie-wspolliniowe,
// len >= 1 — zeby autoFix sklasyfikowal jako realny reshape, nie nub).
function _e1ClPoints(pair, off) {
  const dx = pair.bx - pair.ax, dy = pair.by - pair.ay;
  const ux = Math.sign(dx), uy = Math.sign(dy);
  const L = Math.max(Math.abs(dx), Math.abs(dy)) || 2;
  const px = -uy, py = ux;
  return [
    [pair.ax + ux * (L / 3) + px * off, pair.ay + uy * (L / 3) + py * off],
    [pair.ax + ux * (2 * L / 3) + px * off, pair.ay + uy * (2 * L / 3) + py * off],
  ];
}

function buildE1Delta() {
  loadBase('dat');
  const P = ev(E1_SCAN).val;
  if (!P || !P.pair || !P.roomG || !P.roomK) throw new Error('scan: pair=' + !!(P && P.pair)
    + ' roomG=' + (P && P.roomG) + ' roomK=' + (P && P.roomK));
  const D = W().document;
  const expect = (t) => {
    const got = _e1LastType();
    if (got !== t) throw new Error('oczekiwano ' + t + ', ostatni wpis deltaLog: ' + got);
  };

  // 1. ADD_AREA
  W().commitAddArea('E1 Test Area');
  expect('ADD_AREA');
  const na = ev('state.deltaLog[state.deltaLog.length-1].areaId').val;

  // 2. ADD_ROOM w nowym (sid) obszarze
  ex('state.areaId = ' + na + '; state.z = 0; return "ok";');
  W().addRoomAtPosition(50, 50);
  expect('ADD_ROOM');
  const r1 = ev('state.deltaLog[state.deltaLog.length-1].roomId').val;

  // 3-4. ADD_EXIT (cel sid + cel fixture)
  W().commitAddExit(P.srcX, P.srcDirX, r1, false);
  expect('ADD_EXIT');
  W().commitAddExit(P.srcY, P.srcDirY, P.roomA, false);
  expect('ADD_EXIT');

  // 5-6. ADD_CL + EDIT_CL na parze (setup pod AUTO_FIX: realny reshape)
  const pts1 = _e1ClPoints(P.pair, 0.5);
  ex('state.clRoom = state.roomById[' + P.pair.a + ']; state.clDir = ' + JSON.stringify(P.pair.dir) + ';'
   + ' state.clIsNew = true; state.clPoints = ' + JSON.stringify(pts1) + '; return "ok";');
  W().commitCLDrawing();
  expect('ADD_CL');
  ex('state.clRoom = state.roomById[' + P.pair.a + ']; state.clDir = ' + JSON.stringify(P.pair.dir) + ';'
   + ' state.clIsNew = false; state.clOriginalPoints = ' + JSON.stringify(pts1) + ';'
   + ' state.clPoints = ' + JSON.stringify(_e1ClPoints(P.pair, 0.9)) + '; return "ok";');
  W().commitCLDrawing();
  expect('EDIT_CL');

  // 7-8. ADD_SUPPRESSOR + DELETE_SUPPRESSOR (realny przycisk .cl-del w panelu)

scenario('E1.roundtrip', async () => {
  if (!_e1Delta) { FAIL('E1.roundtrip', 'brak kalki z E1.build'); return; }
  loadBase('dat');
  const cls = classifyText(_e1Text);
  const notOk = (cls.items || []).filter(i => i.c !== 'ok');
  // FIX F1: klasyfikator symuluje wczesniejsze opy kalki na cieniu stanu —
  // EDIT_CL po ADD_CL, DELETE_SUPPRESSOR po ADD_SUPPRESSOR, EDIT_EXIT po EDIT_ROOM
  // i DELETE_AREA na sid-area sa teraz 'ok' (dawniej impossible/hard).
  A('E1.roundtrip.cls-ok27', cls.items && cls.items.length === 27 && notOk.length === 0,
    'fix F1: wszystkie 27 opow ok' + (notOk.length ? ' [nie-ok: ' + notOk.map(i => i.t + ':' + i.c + (i.n ? '(' + i.n + ')' : '')).join(',') + ']' : ''));
  const PREV_SEQ = ['EDIT_CL', 'DELETE_SUPPRESSOR', 'EDIT_EXIT', 'DELETE_AREA'];
  EQ('E1.roundtrip.cls-knownseq', (cls.items || []).filter(i => PREV_SEQ.includes(i.t) && i.c !== 'ok').map(i => i.t + ':' + i.c), [],
    'fix F1: dawne degradacje sekwencyjne (EDIT_CL/DELETE_SUPPRESSOR/EDIT_EXIT/DELETE_AREA) sa ok');
  const r = W().applyDelta(_e1Delta, null, undefined);
  A('E1.roundtrip.applied', r.applied === 27 && r.skipped.length === 0,
    'applied=' + r.applied + ' skipped=' + r.skipped.length + (r.skipped.length ? ' ' + JSON.stringify(r.skipped) : ''));

});

scenario('E1.idempotent', async () => {
  if (!_e1Delta) { FAIL('E1.idempotent', 'brak kalki z E1.build'); return; }
  loadBase('dat');
  W().applyDelta(_e1Delta, null, undefined);
  const crc1 = ev('_computeBaseInfo().crc').val;
  // Re-klasyfikacja na stanie po apply — watchdog done-coverage klasyfikatora
  const items2 = W().classifyDelta(_e1Delta);
  const proj = items2.map(i => i.type + ':' + i.cls);
  const doneN = proj.filter(p => p.endsWith(':done')).length;
  // Po F1: done 12/27. Klasyfikator z symulacja sekwencji (cien stanu) rozstrzyga
  // pary add/delete jako ok/hard — re-apply to spojny replay (nie done), a delete-opsy
  // na nieobecnych celach pozostaja impossible (= skip, bez mutacji).
  A('E1.idempotent.done12', doneN === 12, 'watchdog F1: done ' + doneN + '/27 (replay sekwencyjny: pary add/delete CL/tlumika/area + labele ok; reszta done) [nie-done: '
    + proj.filter(p => !p.endsWith(':done')).join(', ') + ']');
  EQ('E1.idempotent.impossible-set', items2.filter(i => i.cls === 'impossible').map(i => i.type).sort(),
    ['DELETE_CL', 'DELETE_EXIT', 'DELETE_ROOM', 'DELETE_SPECIAL_EXIT'],
    'fix F1: DELETE_AREA i DELETE_SUPPRESSOR juz rozstrzygalne (symulacja); pozostale delete-opsy impossible');
  // Sciezka panelu: drugi apply z domyslnie zaznaczonych — watchdog rozbieznosci
  const checkedSeqs = new Set(items2.filter(i => i.checked).map(i => i.seq));
  const r3 = W().applyDelta(_e1Delta, checkedSeqs, undefined);
  const crc2 = ev('_computeBaseInfo().crc').val;
  A('E1.idempotent.panel65', r3.applied === 6 && r3.skipped.length === 5,
    'fix F1: drugi apply (panel) applied=' + r3.applied + ' skipped=' + r3.skipped.length
    + ' (pary sekwencyjne ok/hard = replay; impossible = skip)');
  A('E1.idempotent.panel-converges', crc2 === crc1,
    'fix F1: drugi apply (panel) ZBIEGA do tego samego stanu — spojny replay [crc=' + crc1 + ' vs ' + crc2 + ']');
  // Surowy drugi apply — swiezy tor (zeby undoStack nie przekroczyl capa 50)
  loadBase('dat');
  W().applyDelta(_e1Delta, null, undefined);
  const r4 = W().applyDelta(_e1Delta, null, undefined);
  const crc4 = ev('_computeBaseInfo().crc').val;
  A('E1.idempotent.raw2-21', r4.applied === 21 && r4.skipped.length === 6,
    'watchdog F2: surowy drugi apply applied=' + r4.applied + ' skipped=' + r4.skipped.length);
  A('E1.idempotent.raw2-diverges', crc4 !== crc1,
    'watchdog: surowy drugi apply ROZBIEGA stan (raw = force bez klasyfikacji — poza zakresem F1)');
  W().undoAll();
  EQ('E1.idempotent.undo', ev('_computeBaseInfo().crc').val, ev('state.baseInfo.crc').val,
    'undoAll po 2 apply (49 wpisow, pod cap 50) wraca do bazy');
});

// Warianty: clean (kontrola) / mod (obiekt zmieniony upstream) / del (obiekt

// Warianty: bezposrednia mutacja stanu (upstream = cudza nowsza wersja mapy
// — nie wymaga wpisow undo). Testowana sciezka: klasyfikacja + apply.

const E2_SCAN = '(function(){'

// Craft pojedynczej kalki (checksumy funkcjami aplikacji) — dla typow, ktorych
// nie da sie wygenerowac jedno-opowo z czystej bazy fixture.
function _e2Craft(opsArr) {
  const fmt = ev('({ f: ARKDELTA_FORMAT, v: ARKDELTA_FORMAT_VERSION })').val;
  const meta = { format: fmt.f, format_version: fmt.v, ops_count: opsArr.length,
                 base: ev('state.baseInfo').val, app_version: 'e2-craft' };
  const ops = opsArr.map((o, i) => ({ seq: i + 1, type: o.type, target: o.target, payload: o.payload, label: o.label || o.type }));
  const checksums = W()._deltaChecksums(meta, ops);
  return W().stableStringify({ meta, ops, checksums });
}

  if (!_e2P) { loadBase('dat'); _e2P = ev(E2_SCAN).val; }
  const P = _e2P;

  catch (e) { FAIL('E2.' + d.type, 'make: ' + String(e && e.message || e)); return; }
  const v = W().validateDeltaText(text);
  A('E2.' + d.type + '.file', v.ok === true && v.delta.ops.length === d.ops,
    'kalka: walidacja + ' + d.ops + ' op(y)' + (v.ok ? '' : ' ' + (v.errors || []).join('; ')));
  if (!v.ok) return;
  for (const vn of ['clean', 'mod', 'del', 'conflict']) {
    const cell = d.cells[vn];
    const id = 'E2.' + d.type + '.' + vn;
    if (!cell) { PASS(id, 'nie dotyczy — ' + ((d.na && d.na[vn]) || 'brak sensownego skrzyżowania')); continue; }
    loadBase('dat');
    try { if (cell.prep) cell.prep(P, text); } catch (e) { FAIL(id, 'prep: ' + String(e && e.message || e)); continue; }
    const vv = W().validateDeltaText(text);
    const items = W().classifyDelta(vv.delta);
    const it = items[items.length - 1];
    A(id + '.cls', it.cls === cell.exp.cls && (cell.exp.coll === undefined || !!it.coll === cell.exp.coll),
      'cls=' + it.cls + (it.note ? ' (' + it.note + ')' : '') + (it.coll ? ' [coll]' : '')
      + ' [oczekiwano ' + cell.exp.cls + (cell.exp.coll ? '+coll' : '') + ']');
    const r = W().applyDelta(vv.delta, null, undefined);
    const ea = cell.exp.applied === undefined ? 1 : cell.exp.applied;
    const es = cell.exp.skipped === undefined ? 0 : cell.exp.skipped;
    A(id + '.apply', r.applied === ea && r.skipped.length === es,
      'applied=' + r.applied + ' skipped=' + r.skipped.length
      + (r.skipped.length ? ' (' + r.skipped[0].reason + ')' : '') + ' [oczekiwano ' + ea + '/' + es + ']');
    if (cell.post) { try { cell.post(P, id); } catch (e) { FAIL(id + '.post', String(e && e.message || e)); } }
  }
}

// ═══ E3: kolizje pozycyjne — autopozycja / reczne wskazanie / batch / rebase ═══
// Wyrocznia spiralna w driverze: replikuje UDOKUMENTOWANY porzadek pierscieni Manhattan
// (dy rosnaco, dx = [-(r-|dy|), +(r-|dy|)]), ale zajetosc mapy bierze wylacznie z _deltaRoomAt.
const E3_SPIRAL = (() => {
  const out = [];
  for (let r = 0; r <= 25; r++) for (let dy = -r; dy <= r; dy++) {
    const dxA = r - Math.abs(dy); const dxs = dxA === 0 ? [0] : [-dxA, dxA];
    for (const dx of dxs) out.push([dx, dy]);
  }
  return out;
})();
function _e3TakenSet(){
  const areaId = ev('state.areaId').val;
  const s = new Set();
  for (const [x, y] of [[9999,9999],[9999,9999],[9998,9999],[10000,9999]]) s.add(areaId+':'+x+':'+y+':0');
  return s;
}
function _e3Oracle(taken, x0, y0){
  const areaId = ev('state.areaId').val;
  for (const [dx, dy] of E3_SPIRAL){
    const x = x0 + dx, y = y0 + dy;
    if (taken.has(areaId+':'+x+':'+y+':0')) continue;
    if (!ev('!!_deltaRoomAt(' + JSON.stringify(areaId) + ', ' + x + ', ' + y + ', 0)').val) return {x, y};
  }
  return null;
}
// Pokoje po komorce (state.roomById = mapa obiektowa).
function _e3CountAt(x, y){
  return ev('Object.values(state.roomById).filter(r => r.x === ' + x + ' && r.y === ' + y
    + ' && (r.z ?? 0) === 0).length').val;
}
// Kalka kolizyjna: 2x ADD_ROOM na (9999,9999) [stack w edytorze], MOVE_ROOM pierwszego
// pokoju obszaru na (9998,9999), ADD_ROOM kontrolny na (10000,9999). Commity na CZYSTEJ
// bazie, potem eksport. Izolacja: bazowa mape przywraca loadBase w e3Setup.
async function _e3Text(){
  const areaId = ev('state.areaId').val;
  _e3CommitAddRoom(9999, 9999);
  _e3CommitAddRoom(9999, 9999);   // celowy stack — kalka z 2 ADD na tym samym polu (guard v1.19.0)
  const mvId = ev('state.areas.get(' + JSON.stringify(areaId) + ').rooms.find('
    + ' r => !(r.x === 9999 && r.y === 9999)).id').val;
  ex('commitMoveRoom(state.roomById[' + JSON.stringify(mvId) + '],'
    + ' state.roomById[' + JSON.stringify(mvId) + '].x, state.roomById[' + JSON.stringify(mvId) + '].y, 0, 9998, 9999, 0)');
  ex('addRoomAtPosition(10000, 9999)');
  return { text: ev('buildDelta()').val, mvId };
}
// Pelny setup kolizji: commity kalki na czystej bazie -> eksport -> SWIEZA baza
// (commity znikaja) -> upstream dorzuca pokoje na (9999,9999) i (9998,9999) -> panel.

  await loadBase('dat');

  return t;
}

}

// Craft z pelna kontrola nad meta/seq/checksumami (checksumy funkcjami aplikacji).
function _e4Craft(opsArr, opts){
  opts = opts || {};
  const meta = Object.assign({ format: ev('ARKDELTA_FORMAT').val, format_version: ev('ARKDELTA_FORMAT_VERSION').val,
    ops_count: opsArr.length, base: ev('state.baseInfo').val, app_version: 'e4-craft' }, opts.meta || {});
  const ops = opsArr.map((o, i) => Object.assign({ seq: i + 1 }, o));
  const checksums = W()._deltaChecksums(meta, ops);
  if (opts.fileCrcStale) checksums.file = '0000000000000000';
  return W().stableStringify({ meta, ops, checksums });
}
// Wczytanie przez prawdziwy handler change (DataTransfer + File), czekanie na async handler.
async function _e4LoadExpr(expr){
  ex('(function(){ const text = (' + expr + '); const dt = new DataTransfer();'
    + ' dt.items.add(new File([text], "test.arkdelta"));'
    + ' const fi = document.getElementById("fi-arkdelta"); fi.files = dt.files;'
    + ' fi.dispatchEvent(new Event("change", { bubbles: true })); })()');
  return eva('(async()=>{ for (let i = 0; i < 5000; i++){'
    + ' if (document.querySelector(".dlg-bg.open") || document.getElementById("delta-panel").classList.contains("visible")) return true;'
    + ' await new Promise(r => setTimeout(r, 10)); } return false; })()');
}
async function _e4Load(text){ return _e4LoadExpr(JSON.stringify(text)); }
function _e4Surface(){
  return JSON.parse(ev('JSON.stringify({'
    + ' err: !!document.querySelector("#dlg-arkdelta.open"),'
    + ' errText: (document.getElementById("arkdelta-body") || {}).textContent || "",'
    + ' mis: !!document.querySelector("#dlg-arkdelta-mismatch.open"),'
    + ' misText: (document.getElementById("arkdelta-mismatch-body") || {}).textContent || "",'
    + ' panel: document.getElementById("delta-panel").classList.contains("visible")'
    + ' })').val);
}
function _e4Reset(){
  ex('(function(){ for (const d of document.querySelectorAll(".dlg-bg.open")) d.classList.remove("open");'
    + ' document.getElementById("delta-panel").classList.remove("visible"); })()');
}
async function _e4ValidText(){
  ex('addRoomAtPosition(5000, 5000)');
  return ev('buildDelta()').val;
}

scenario('E4.integrity', async () => {
  await loadBase('dat');
  const valid = await _e4ValidText();
  const crc0 = ev('_computeBaseInfo().crc').val;
  // podmiana tresci opu, checksumy oryginalne
  const tampered = JSON.parse(valid);
  tampered.ops[0].label = 'TAMPERED';
  const tamperedText = JSON.stringify(tampered);
  // podmiana tresci + przeliczenie checksumy opu, zbiorcza stala
  const tampered2 = JSON.parse(valid);
  tampered2.ops[0].label = 'TAMPERED-2';
  tampered2.checksums.ops[0] = W()._deltaChecksums(tampered2.meta, tampered2.ops).ops[0];
  const tampered2Text = JSON.stringify(tampered2);
  const protoOp = JSON.parse('{"type":"PAINT_BATCH","target":{},"payload":{"__proto__":{"polluted":true},"changes":[]}}');
  const cases = [
    ['tamper-op', tamperedText, ['uszkodzony', '#1 nie zgadza']],
    ['tamper-file', tampered2Text, ['uszkodzony']],
    ['unknown-type', _e4Craft([{ type: 'NUKE_MAP', target: {}, payload: {} }]), ['nieznany typ operacji', 'NUKE_MAP']],
    ['seq-gap', _e4Craft([{ type: 'PAINT_BATCH', target: {}, payload: { changes: [] } },
                          { seq: 3, type: 'PAINT_BATCH', target: {}, payload: { changes: [] } }]), ['numeracja nie jest po kolei']],
    ['ops-count', _e4Craft([{ type: 'PAINT_BATCH', target: {}, payload: { changes: [] } }], { meta: { ops_count: 99 } }), ['w nagłówku (99)']],
    ['proto', _e4Craft([protoOp]), ['niedozwolony klucz', '__proto__']],
    ['sid-forward', _e4Craft([{ type: 'ADD_EXIT', target: { sourceId: 'd:9', dir: 'n' }, payload: { targetId: 1 } }]), ['nieistniejącego obiektu kalki', 'd:9']],
  ];
  for (const [name, text, frags] of cases){
    await _e4Load(text);
    const s = _e4Surface();
    A('E4.integrity.' + name + '.err', s.err && !s.panel, name + ': odrzucony (dialog bledow)');
    let all = true; for (const f of frags) if (s.errText.indexOf(f) < 0) all = false;
    A('E4.integrity.' + name + '.msg', all, name + ': komunikat zawiera ' + JSON.stringify(frags));
    _e4Reset();
  }
  // tamper-file: zbiorcza nie pasuje, ale per-op zgodne — brak lokalizacji opu
  A('E4.integrity.tamper-file.noloc', true, 'miejsce na asercje ponizej');
  await _e4Load(tampered2Text);
  const s2 = _e4Surface();
  A('E4.integrity.tamper-file.no-op-loc', s2.err && s2.errText.indexOf('nie zgadza się z sumą') < 0,
    'tamper-file: blad zbiorczy BEZ lokalizacji opu (checksumy opow przeliczone)');
  _e4Reset();
  EQ('E4.integrity.untouched', ev('_computeBaseInfo().crc').val, crc0, 'stan mapy nietkniety po odrzuconych plikach');
});

// Konwersja mapa->client zgodna z handlerem contextmenu (bez skalowania rect).
function _e5ClientXY(x, y){
  return JSON.parse(ev('(function(){ const cv = document.getElementById("cv");'
    + ' const r = cv.getBoundingClientRect();'
    + ' return JSON.stringify({ x: r.left + state.ox + (' + x + ') * CELL * state.zoom,'

}
function _e5CtxAt(x, y){
  const p = _e5ClientXY(x, y);
  ex('document.getElementById("cv").dispatchEvent(new MouseEvent("contextmenu",'
    + ' { clientX: ' + p.x + ', clientY: ' + p.y + ', bubbles: true }))');
}

// ═══ E8.labelkeep: etykiety kalki zachowane przez 6 niskopoziomowych sciezek commit (v1.35.0) ═══
// Reprodukcja buga z testow recznych: re-eksport („Zapisz naniesione zmiany") gubil
// customowe op.label dla ADD_EXIT/DELETE_EXIT/MOVE_ROOM/MOVE_ROOM_TO_AREA/DELETE_ROOM/DELETE_AREA,
// bo niskopoziomowe commit* generowaly wlasne auto-etykiety. Fix: entry.label = op.label || auto.
scenario('E8.labelkeep', async () => {
  await loadBase('dat');
  // 6 niezależnych opow budowanych na zywej mapie (bez hardkodowanej geometrii),
  // kazdy z rozpoznawcza customowa etykieta:
  const ops = JSON.parse(ev(`JSON.stringify((() => {
    const rooms = Object.values(state.roomById).sort((a, b) => a.id - b.id);
    const DIRS = ['n','ne','e','se','s','sw','w','nw'];
    // ADD_EXIT: pierwszy pokoj z wolnym kierunkiem, cel = inny istniejacy pokoj
    let ae = null;
    for (const r of rooms) {
      const free = DIRS.find(d => !(r.exits && r.exits[d] !== undefined) && !(r.stubs || []).includes(d));
      if (free) { ae = { sourceId: r.id, dir: free, targetId: rooms.find(x => x.id !== r.id).id }; break; }
    }
    // DELETE_EXIT: pierwszy INNY pokoj z istniejacym wyjsciem
    let de = null;
    for (const r of rooms) {
      if (r.id === ae.sourceId) continue;
      const d = Object.keys(r.exits || {})[0];
      if (d) { de = { roomId: r.id, dir: d }; break; }
    }
    // MOVE_ROOM: pierwszy pokoj na gwarantowanie wolna komorke (skan _deltaRoomAt)
    const mr = rooms[0];
    const mArea = state.roomArea[mr.id];
    let tx = mr.x + 500, ty = mr.y + 500; const tz = mr.z ?? 0;
    while (_deltaRoomAt(mArea, tx, ty, tz)) tx += 17;
    // MOVE_ROOM_TO_AREA: INNY pokoj do innego istniejacego obszaru
    const areaIds = [...state.areas.keys()];
    const mar = rooms.find(r => r.id !== mr.id);
    const mFrom = state.roomArea[mar.id];
    const mTo = areaIds.find(a => a !== mFrom);
    // DELETE_ROOM: pokoj nie uzyty wyzej
    const dr = rooms.find(r => r.id !== ae.sourceId && r.id !== de.roomId && r.id !== mr.id && r.id !== mar.id);
    // DELETE_AREA: obszar z najmniejsza liczba pokojow (baza testowa — kaskada OK);
    // bez Default Area (id <= 0 — zarezerwowana, commitDeleteArea odmawia)
    const counts = new Map(areaIds.map(a => [a, 0]));
    for (const r of rooms) counts.set(state.roomArea[r.id], (counts.get(state.roomArea[r.id]) || 0) + 1);
    const daArea = areaIds.filter(a => a > 0).slice().sort((a, b) => counts.get(a) - counts.get(b))[0];
    return [
      { type: 'ADD_EXIT', target: { sourceId: ae.sourceId, dir: ae.dir },
        payload: { targetId: ae.targetId, bidirectional: false }, label: 'CUSTOM ADD_EXIT' },
      { type: 'DELETE_EXIT', target: { roomId: de.roomId, dir: de.dir }, payload: {}, label: 'CUSTOM DELETE_EXIT' },
      { type: 'MOVE_ROOM', target: { roomId: mr.id },
        payload: { fromX: mr.x, fromY: mr.y, fromZ: mr.z ?? 0, toX: tx, toY: ty, toZ: tz }, label: 'CUSTOM MOVE_ROOM' },
      { type: 'MOVE_ROOM_TO_AREA', target: { roomId: mar.id },
        payload: { fromAreaId: mFrom, toAreaId: mTo }, label: 'CUSTOM MOVE_ROOM_TO_AREA' },
      { type: 'DELETE_ROOM', target: { roomId: dr.id, areaId: state.roomArea[dr.id] },
        payload: { room: JSON.parse(JSON.stringify(dr)) }, label: 'CUSTOM DELETE_ROOM' },
      { type: 'DELETE_AREA', target: { areaId: daArea },
        payload: { name: state.areas.get(daArea).name }, label: 'CUSTOM DELETE_AREA' },
    ];
  })())`).val);
  const text = _e4Craft(ops);
  const res = JSON.parse(ev('JSON.stringify(applyDelta(validateDeltaText(' + JSON.stringify(text) + ').delta))').val);
  EQ('E8.labelkeep.applied', res.applied, 6, 'apply: wszystkie 6 opow naniesione');
  EQ('E8.labelkeep.skipped', res.skipped.length, 0, 'apply: zero pomińiętych');
  EQ('E8.labelkeep.loglabels', JSON.parse(ev('JSON.stringify(state.deltaLog.map(e => e.label))').val),
    ['CUSTOM ADD_EXIT', 'CUSTOM DELETE_EXIT', 'CUSTOM MOVE_ROOM', 'CUSTOM MOVE_ROOM_TO_AREA', 'CUSTOM DELETE_ROOM', 'CUSTOM DELETE_AREA'],
    'wpisy undo niosa etykiety kalki (nie auto-etykiety)');
  const ops2 = JSON.parse(ev('JSON.stringify(validateDeltaText(' + JSON.stringify(ev('buildDelta()').val) + ').delta.ops.map(o => [o.type, o.label]))').val);
  EQ('E8.labelkeep.reexport', ops2,
    [['ADD_EXIT', 'CUSTOM ADD_EXIT'], ['DELETE_EXIT', 'CUSTOM DELETE_EXIT'], ['MOVE_ROOM', 'CUSTOM MOVE_ROOM'],
     ['MOVE_ROOM_TO_AREA', 'CUSTOM MOVE_ROOM_TO_AREA'], ['DELETE_ROOM', 'CUSTOM DELETE_ROOM'], ['DELETE_AREA', 'CUSTOM DELETE_AREA']],
    're-eksport (buildDelta): etykiety kalki zachowane round-trip dla 6 typow');
  // porzadkowosc: undo-all wraca do bazy (zadna z 6 sciezek nie zostawia sladu)
  ex('undoAll()');
  EQ('E8.labelkeep.undo', ev('_computeBaseInfo().crc').val, ev('state.baseInfo.crc').val,
    'undoAll po apply: baza odtworzona (6 sciezek bez sladu)');
});

    for (const r of Object.values(state.roomById)) counts.set(state.roomArea[r.id], (counts.get(state.roomArea[r.id]) || 0) + 1);
    const aid = areaIds.slice().sort((a, b) => counts.get(b) - counts.get(a))[0];  // najgesciej zaludniony
    const area = state.areas.get(aid);
    let fx = 4000, fy = 4000; const fz = 0;
    while (_deltaRoomAt(aid, fx, fy, fz)) fx += 13;
    return { aid, name: area.name, x: fx, y: fy, z: fz };
  })())`).val);
  const text = _e4Craft([
    { type: 'ADD_AREA', target: { areaId: 'd:1' },

    { type: 'ADD_ROOM', target: { roomId: 'd:2', areaId: 'd:1' },
      payload: { room: { id: 'd:2', x: prep.x, y: prep.y, z: prep.z, name: 'TIER1 SEED', env: 1 } }, label: 'T1 ADD_ROOM' },

    ['done', 'ok'], 'recenzja: ADD_AREA done (nazwa), ADD_ROOM ok');
  EQ('E8.tier1.checked', JSON.parse(ev('JSON.stringify(_deltaReview.items.map(i => i.checked))').val),
    [false, true], 'recenzja: done odznaczone, ok zaznaczone (domyslne)');
  ex('_deltaApplyReviewed()');  // sciezka produkcyjna: seed z klasyfikacji
  const seedRoom = JSON.parse(ev(`JSON.stringify((() => {
    const r = Object.values(state.roomById).find(x => x.name === 'TIER1 SEED');
    return r ? { id: r.id, area: state.roomArea[r.id] } : null;
  })())`).val);
  EQ('E8.tier1.applied', !!seedRoom && seedRoom.area === prep.aid, true,
    'apply przez panel: zalezny ADD_ROOM naniesiony do zywego obszaru (seed done-SID)');
  EQ('E8.tier1.masked', JSON.parse(ev('JSON.stringify(_deltaReview.items.map(i => [i.seq, i.cls, i.session || false]))').val),
    [[1, 'done', false], [2, 'done', true]], 'po apply: op2 maskowany done „naniesione z tej kalki"');
  EQ('E8.tier1.log', JSON.parse(ev('JSON.stringify(state.deltaLog.map(e => [e.type, e.label]))').val),
    [['ADD_ROOM', 'T1 ADD_ROOM']], 'deltaLog: dokladnie jeden wpis, etykieta kalki zachowana');
  // idempotentnosc: ponowne Zastosuj niczego nie nanosi (op2 juz done)
  ex('_deltaApplyReviewed()');
  EQ('E8.tier1.idem', JSON.parse(ev('JSON.stringify(state.deltaLog.map(e => e.type))').val),
    ['ADD_ROOM'], 'drugie Zastosuj: zero nowych wpisow (idempotentnosc)');
  ex('undoAll()');
  EQ('E8.tier1.undo', ev('_computeBaseInfo().crc').val, ev('state.baseInfo.crc').val,
    'undoAll: baza odtworzona');

  // W15: DELETE_AREA obszaru domyslnego (id <= 0) — klasyfikacja impossible + apply skip
  const defId = JSON.parse(ev(`JSON.stringify((() => { for (const id of state.areas.keys()) if (id <= 0) return id; return null; })())`).val);
  EQ('E8.tier1.defarea', defId !== null, true, 'mapa ma obszar domyslny (id <= 0) — fixture do W15');

  if (!rApp.ok) throw new Error('ev apply: ' + rApp.err);

scenario('E10.dat-roundtrip', async () => {
  // Bramka zapisu .dat (W1/W2): writer musi byc stabilny (fixpoint bajtowy) i zgodny
  // z wyjsciem writera v1.38.0 dla fixture — E5/E6 dotykaja tylko ujemnych id,
  // ktorych fixture nie ma. Bajt-w-bajt WZGLEDEM FIXTURE nie ma sensu: fixture pisal
  // Mudlet, a nasz writer normalizuje kolejnosci (np. stubs) juz od v1.38.0 (sprawdzone).
  const rr = await eva('(async function(){'
    + ' const resp = await fetch("map_master3.dat");'
    + ' if (!resp.ok) return { eq: false, why: "HTTP " + resp.status };'
    + ' const buf = await resp.arrayBuffer();'
    + ' const o1 = arkmapToDat(datToArkmap(buf.slice(0)));'
    + ' const b1 = o1 instanceof Uint8Array ? o1 : new Uint8Array(o1);'
    + ' const o2 = arkmapToDat(datToArkmap(b1.buffer.slice(b1.byteOffset, b1.byteOffset + b1.byteLength)));'
    + ' const b2 = o2 instanceof Uint8Array ? o2 : new Uint8Array(o2);'
    + ' if (b1.length !== b2.length) return { eq: false, why: "fixpoint len " + b1.length + " vs " + b2.length };'
    + ' for (let i = 0; i < b1.length; i++) if (b1[i] !== b2[i]) return { eq: false, why: "fixpoint byte@" + i };'
    + ' let t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (3988292384 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }'
    + ' let crc = 4294967295;'
    + ' for (let j = 0; j < b1.length; j++) crc = t[(crc ^ b1[j]) & 255] ^ (crc >>> 8);'
    + ' crc = (crc ^ 4294967295) >>> 0;'
    + ' return { eq: true, len: b1.length, crc: ("00000000" + crc.toString(16)).slice(-8) }; })()');
  const r = AEV('E10.dat-roundtrip.fixpoint', rr, 'roundtrip .dat');

});

// ═══ Runner ═══
function appReady() {
  return new Promise(res => {
    const t0 = Date.now();
    (function poll() {
      let ok = false;
      try {
        const w = $f.contentWindow;
        ok = !!(w && w.document && w.document.readyState === 'complete'
          && w.eval('typeof datToArkmap === "function" && typeof applyMap === "function"'
                  + ' && typeof startLocalEditMode === "function"'));
      } catch (e) { ok = false; }
      if (ok || Date.now() - t0 > 30000) return res();
      setTimeout(poll, 100);
    })();
  });
}

async function runAll() {
  await appReady();
  try { W().addEventListener('error', e => REC('FAIL', 'js-error', String(e.message || e))); } catch (e) {}
  try { await fetchFixture(); } catch (e) {
    REC('FAIL', 'fixture', 'brak map_master3.dat: ' + e.message);
    return finish();
  }
  const Q = new URLSearchParams(location.search);
  const GRP = Q.get('g');
  const ONLY = (Q.get('sc') || '').split(',').filter(Boolean);
  for (const s of SC) {
    if (GRP && !(s.id === GRP || s.id.startsWith(GRP + '.'))) continue;
    if (ONLY.length && !ONLY.includes(s.id)) continue;
    try { await s.fn(); }
    catch (e) { FAIL(s.id, 'wyjatek scenariusza: ' + String(e && e.message || e)); }
  }
  finish();
}
function finish() {
  $out.textContent += 'SUMMARY|pass=' + _pass + '|fail=' + _fail + '\n';
  const d = document.getElementById('done');
  d.textContent = 'DONE';
  d.style.display = 'block';
  document.title = 'DONE p=' + _pass + ' f=' + _fail;
}

// ═══ GRUPA E23 — Arc 31 F1 (v1.46.0): RAF-batching + shim render-to-offscreen ═══
// E23.raf: scheduleDraw koalescuje do 1 renderu/klatke; draw() zostaje
// synchroniczne (kontrakt dla drivera perf i eksportu). Kontrolowana kolejka
// RAF = determinizm (zero zaleznosci od timingu headless).
scenario('E23.raf', async () => {
  ex('window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(performance.now()); }, 0); };');
  await loadBase('dat');
  await eva('new Promise(function(res){ setTimeout(res, 60); })');  // dopalienie ramek z boot/applyMap
  ex('window.__rafQ = [];'
   + ' window.requestAnimationFrame = function(cb){ window.__rafQ.push(cb); return window.__rafQ.length; };'
   + ' window.__draws = 0; window.__od = window.draw;'
   + ' window.draw = function(){ window.__draws++; return window.__od.apply(this, arguments); };'
   + ' _drawScheduled = false;');
  ex('scheduleDraw(); scheduleDraw();');
  EQ('E23.raf.q1', ev('window.__rafQ.length').val, 1, 'dwa scheduleDraw w klatce = 1 wpis RAF (koalescencja)');
  EQ('E23.raf.lazy', ev('window.__draws').val, 0, 'scheduleDraw nie renderuje synchronicznie');
  ex('window.__rafQ.splice(0).forEach(function(cb){ cb(performance.now()); });');
  EQ('E23.raf.one', ev('window.__draws').val, 1, 'po flush dokladnie 1 render');
  ex('scheduleDraw(); window.__rafQ.splice(0).forEach(function(cb){ cb(performance.now()); });');
  EQ('E23.raf.two', ev('window.__draws').val, 2, 'serie: kazda klatka to co najwyzej 1 render');
  ex('draw();');
  EQ('E23.raf.sync', ev('window.__draws').val, 3, 'draw() bezposrednio = render natychmiastowy (kontrakt zachowany)');
  EQ('E23.raf.rearm', ev('(function(){ var n0 = window.__rafQ.length; scheduleDraw(); return window.__rafQ.length - n0; })()').val, 1,
     'flaga koalescencji zwalnia sie po klatce — nowe scheduleDraw doklada dokladnie 1 wpis RAF');
  ex('window.__rafQ.splice(0); window.draw = window.__od;');
});

// E23.shim: render na offscreen przez _withRenderTarget — izolacja (glowny
// canvas i stan bajtowo/identycznosciowo nietkniete, takze przy wyjatku),
// tlumienie minimapek podczas shima (decyzja D2), fn zwraca wartosc.
scenario('E23.shim', async () => {
  ex('window.requestAnimationFrame = function(cb){ return setTimeout(function(){ cb(performance.now()); }, 0); };');
  await loadBase('dat');
  await eva('new Promise(function(res){ setTimeout(res, 60); })');
  // determinizm: wylacz warstwe etykiet (pixmapy laduja sie asynchronicznie
  // i ich onload schedulowalby render miedzy probkami zlotego hasha)
  ex('state.showPixmaps = false; if (!state.view) state.view = {}; state.view.mudletLabels = false; draw();');
  const before = AEV('E23.shim.pre', ev('(function(){'
   + ' var c = document.getElementById("cv");'
   + ' var d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;'
   + ' var h = 0; for (var i = 0; i < d.length; i += 997) h = (h * 31 + d[i]) >>> 0;'
   + ' window.__mm = 0; window.__mmO = window.updateMinimap_call;'
   + ' window.updateMinimap_call = function(){ window.__mm++; };'
   + ' window.__wp = 0; window.__wpO = window.wpUpdateOverviewThrottled;'
   + ' window.wpUpdateOverviewThrottled = function(){ window.__wp++; };'
   + ' return { px: h, zoom: state.zoom, ox: state.ox, oy: state.oy, z: state.z, areaId: state.areaId };'
   + '})()'), 'zloty hash pikseli + snapshot stanu przed shimem');
  const shim = AEV('E23.shim.run', ev('(function(){'
   + ' var off = document.createElement("canvas"); off.width = 400; off.height = 300;'
   + ' var keep = { roomsZ: state.roomsZ, roomById: state.roomById, areas: state.areas,'
   + '   env: state.map.colors.env_colors, cust: state.map.colors.custom_env_colors };'
   + ' var r = _withRenderTarget(off, { zoom: state.zoom * 2, ox: 11, oy: -7, z: state.z, areaId: state.areaId },'
   + '   { roomsZ: keep.roomsZ, roomById: keep.roomById, areas: keep.areas,'
   + '     envColors: keep.env, customEnvColors: keep.cust },'
   + '   function(){ draw(); return 42; });'
   + ' var d2 = off.getContext("2d").getImageData(0, 0, off.width, off.height).data;'
   + ' var nz = 0; for (var i = 3; i < d2.length; i += 101) if (d2[i] > 0) nz++;'
   + ' return { ret: r, offPx: nz,'
   + '   cvBack: cv === document.getElementById("cv"),'
   + '   ctxBack: ctx === document.getElementById("cv").getContext("2d"),'
   + '   zoomBack: state.zoom, oxBack: state.ox, oyBack: state.oy,'
   + '   roomsZBack: state.roomsZ === keep.roomsZ, areasBack: state.areas === keep.areas,'
   + '   envBack: state.map.colors.env_colors === keep.env, custBack: state.map.colors.custom_env_colors === keep.cust };'
   + '})()'), 'wykonanie shima na offscreen');
  EQ('E23.shim.ret', shim && shim.ret, 42, 'shim zwraca wynik fn');
  A('E23.shim.offrender', shim && shim.offPx > 0, 'offscreen zawiera render (niepuste piksele: ' + (shim && shim.offPx) + ')');
  EQ('E23.shim.cvback', shim && [shim.cvBack, shim.ctxBack], [true, true], 'cv/ctx przywrocone po shimie');
  EQ('E23.shim.viewback', shim && [shim.zoomBack, shim.oxBack, shim.oyBack], before && [before.zoom, before.ox, before.oy],
     'zoom/ox/oy przywrocone po shimie');
  EQ('E23.shim.databack', shim && [shim.roomsZBack, shim.areasBack, shim.envBack, shim.custBack], [true, true, true, true],
     'roomsZ/areas/env_colors/custom_env_colors przywrocone (identycznosc referencji)');
  EQ('E23.shim.mm', ev('window.__mm').val, 0, 'updateMinimap_call stlumione podczas shima (D2)');
  EQ('E23.shim.wp', ev('window.__wp').val, 0, 'wpUpdateOverviewThrottled stlumione podczas shima (D2)');
  ex('window.updateMinimap_call = window.__mmO; window.wpUpdateOverviewThrottled = window.__wpO;');
  const after = AEV('E23.shim.post', ev('(function(){'
   + ' var c = document.getElementById("cv");'
   + ' var d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;'
   + ' var h = 0; for (var i = 0; i < d.length; i += 997) h = (h * 31 + d[i]) >>> 0;'
   + ' return h;'
   + '})()'), 'hash pikseli glownego canvasu po shimie');
  EQ('E23.shim.golden', after, before && before.px, 'glowny canvas BAJTOWO nietkniety przez shim');
  const thr = AEV('E23.shim.throw.r', ev('(function(){'
   + ' var off2 = document.createElement("canvas"); off2.width = 100; off2.height = 100;'
   + ' try { _withRenderTarget(off2, { zoom: 9 }, {}, function(){ throw new Error("boom"); }); }'
   + ' catch (e) {}'
   + ' return { zoomBack: state.zoom, cvBack: cv === document.getElementById("cv"), shimOff: _shimActive };'
   + '})()'), 'finally po wyjatku w fn');
  EQ('E23.shim.throw', thr && [thr.zoomBack === (before && before.zoom), thr.cvBack, thr.shimOff], [true, true, false],
     'try/finally: stan przywrocony mimo wyjatku, _shimActive wylaczone');
});

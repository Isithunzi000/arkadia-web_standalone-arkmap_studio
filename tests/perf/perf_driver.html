<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>perf driver</title></head>
<body style="background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="../../arkmap_studio.html" style="width:1500px;height:950px;border:0"></iframe>
<pre id="out"></pre>
<script>
'use strict';
// perf_driver.html — driver wydajnosciowy (Arc 18). REALNY ZEGAR (bez virtual-time).
// Parametry URL: ?file=<urlenc sciezka>&fmt=arkmap|dat&runs=N&exportdat=1
// Protokol: po zakonczeniu window.__PERF_DONE__=true i w <pre id="out"> linia
//   PERFJSON|{...}     albo   PERFERR|<komunikat>
// Fazy mierzone wywolaniem realnych funkcji apki w realm iframe (ta sama sciezka
// kodu co loadArkmap/loadDat, bez toastow/dialogow — czyste pliki nie otwieraja
// dialogow). Trasa kamery: synchroniczne draw() po ustawieniu state.ox/oy/zoom.
// Uwaga: state jest const (nie trafia na window) — dostep przez W.eval.
const $f = document.getElementById('f'), $out = document.getElementById('out');
const P = new URLSearchParams(location.search);
const FILE = P.get('file'), FMT = P.get('fmt') || 'arkmap', RUNS = parseInt(P.get('runs') || '10', 10);

function done(obj) { $out.textContent = 'PERFJSON|' + JSON.stringify(obj); window.__PERF_DONE__ = true; }
function fail(msg) { $out.textContent = 'PERFERR|' + String(msg).slice(0, 500); window.__PERF_DONE__ = true; }

function stats(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const q = p => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return { n: s.length, min: +s[0].toFixed(1), med: +q(0.5).toFixed(1), p95: +q(0.95).toFixed(1), max: +s[s.length - 1].toFixed(1) };
}

async function reloadIframe() {
  const loaded = new Promise(res => $f.addEventListener('load', res, { once: true }));
  $f.src = $f.src.split('?')[0] + '?perf=' + Math.random().toString(36).slice(2);
  await loaded;
  const W = $f.contentWindow;
  for (let i = 0; i < 200; i++) {
    if (W.applyMap && W.validate && W.datToArkmap && W.verifyChecksums && W.draw) return W;
    await new Promise(r => setTimeout(r, 25));
  }
  throw new Error('apka nie zbootowala w iframe');
}

async function oneRun(W, i) {
  const drawTimes = [];
  const origDraw = W.draw;

  // odczyt pliku (cache-buster per przebieg)
  const tF0 = performance.now();
  const resp = await fetch(FILE + (FILE.includes('?') ? '&' : '?') + 'r=' + i + '&t=' + Date.now(), { cache: 'no-store' });
  const data = FMT === 'dat' ? await resp.arrayBuffer() : await resp.text();
  const tFetch = performance.now() - tF0;

  const ph = {};
  const T0 = performance.now();
  let map;
  if (FMT === 'dat') {
    let t = performance.now();
    map = W.datToArkmap(data);
    ph.parse = performance.now() - t;
    t = performance.now();
    const v = W.validate(map);
    ph.validate = performance.now() - t;
    if (!v.ok) throw new Error('validate !ok: ' + ((v.errors[0] || {}).message || '?'));
    ph.crc = 0;
  } else {
    let t = performance.now();
    map = W.JSON.parse(data);
    ph.parse = performance.now() - t;
    t = performance.now();
    const v = W.validate(map);
    ph.validate = performance.now() - t;
    if (!v.ok) throw new Error('validate !ok: ' + ((v.errors[0] || {}).message || '?'));
    t = performance.now();
    const c = W.verifyChecksums(map);
    ph.crc = performance.now() - t;
    if (c.present && !c.ok) throw new Error('checksums !ok (plik generatora musi miec zgodne sumy)');
  }
  W.eval("state.filename = 'perf.' + " + JSON.stringify(FMT));
  // wrapper draw() zakladany TUZ PRZED applyMap — pierwszy draw PO powrocie
  // applyMap to pierwszy render MAPY (synchroniczny draw w trakcie applyMap
  // wraca wczesnie, bo roomsZ jeszcze puste)
  let applyDone = false;
  W.draw = function () { const t0 = performance.now(); origDraw.apply(this, arguments); drawTimes.push({ dt: performance.now() - t0, after: applyDone }); };
  let t = performance.now();
  W.applyMap(map);
  ph.apply = performance.now() - t;
  applyDone = true;
  // dopal asynchroniczny pierwszy render, jesli poszedl przez rAF
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
  const fd = drawTimes.find(d => d.after);
  ph.first_draw = fd ? fd.dt : (drawTimes.length ? drawTimes[drawTimes.length - 1].dt : null);
  ph.total = performance.now() - T0;
  ph.fetch = tFetch;
  ph.heap_mb = W.performance.memory ? +(W.performance.memory.usedJSHeapSize / 1048576).toFixed(0) : null;
  W.draw = origDraw;
  return ph;
}

// Trasa kamery: 5 pozycji x 8 zoomow = 40 krokow, deterministycznie wzgledem
// stanu po applyMap (apka sama robi fit; pan = ulamki W/H canvasu, zoom =
// mnoznik wzgledem srodka ekranu; znaki/flip Y bez znaczenia — pozycje ±).
async function cameraPath(W) {
  const cv = W.document.querySelector('canvas');
  const CW = cv.width, CH = cv.height;
  const positions = [[0, 0], [0.35, 0], [-0.35, 0], [0, 0.3], [0, -0.3]];
  const zooms = [0.5, 0.75, 1, 1.5, 2, 3, 4, 0.25];
  const st0 = W.eval('JSON.stringify({zoom: state.zoom, ox: state.ox, oy: state.oy})');
  const { zoom: baseZoom, ox: baseOx, oy: baseOy } = JSON.parse(st0);
  const times = [];
  for (const zf of zooms) {
    for (const [dx, dy] of positions) {
      const nz = baseZoom * zf;
      W.eval('state.zoom = ' + nz + '; state.ox = ' + (CW / 2 - (CW / 2 - baseOx) * (nz / baseZoom) + dx * CW) + '; state.oy = ' + (CH / 2 - (CH / 2 - baseOy) * (nz / baseZoom) + dy * CH));
      const t0 = performance.now();
      W.draw();
      times.push(performance.now() - t0);
    }
  }
  return stats(times);
}

(async function main() {
  if (!FILE) { fail('brak parametru file'); return; }
  try {
    const runs = [];
    for (let i = 0; i < RUNS; i++) {
      const W = await reloadIframe();
      runs.push(await oneRun(W, i));
    }
    // trasa kamery na mapie z ostatniego przebiegu (mapa nadal zaladowana)
    const W = $f.contentWindow;
    const cam = await cameraPath(W);
    // bonus: eksport .dat w przegladarce („Eksportuj Mudlet .dat") — OSTATNI,
    // bo przy duzych mapach moze zabic karte (OOM = wynik stress testu)
    let exportDat = null;
    if (P.get('exportdat') === '1' && FMT === 'arkmap') {
      try {
        const t0 = performance.now();
        const bytes = W.arkmapToDat(W.eval('state.map'));
        exportDat = { ms: +(performance.now() - t0).toFixed(1), mb: +(bytes.length / 1048576).toFixed(1) };
      } catch (e) { exportDat = { error: String(e && e.message || e).slice(0, 200) }; }
    }
    const phases = {};
    for (const k of ['fetch', 'parse', 'validate', 'crc', 'apply', 'first_draw', 'total']) {
      phases[k] = stats(runs.map(r => r[k]).filter(v => v !== null && v !== undefined));
    }
    done({
      file: FILE, fmt: FMT, runs: RUNS,
      rooms: W.eval('state.map.areas.reduce((s, a) => s + a.rooms.length, 0)'),
      phases, camera: cam, export_dat: exportDat,
      heap_mb_med: stats(runs.map(r => r.heap_mb).filter(v => v !== null)).med,
      userAgent: navigator.userAgent,
    });
  } catch (e) { fail(e && e.message || e); }
})();
</script>
</body></html>
